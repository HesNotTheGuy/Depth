name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-build:
    name: SDK — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: sdk
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: sdk
        run: cmake --build build --config Release

      - name: Test
        working-directory: sdk
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/tests/Release/depth_tests.exe
          else
            ./build/tests/depth_tests
          fi
        shell: bash

  web-build:
    name: Web — build & typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build
