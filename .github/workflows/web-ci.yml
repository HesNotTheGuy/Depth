name: web-ci

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Workaround for npm bug #4828: lockfiles generated on Windows
      # only record win32 native bindings (e.g. @tailwindcss/oxide-win32-x64-msvc).
      # We have BOTH a root workspace lockfile and a web/ lockfile from
      # before the workspace migration; nuke both and let CI rebuild fresh.
      # npm workspaces install from the repo root.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          rm -f package-lock.json web/package-lock.json
          npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
