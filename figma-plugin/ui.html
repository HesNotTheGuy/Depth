<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Depth</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #0d0d0f;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI',
          sans-serif;
      }
      #header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: #17171a;
        border-bottom: 1px solid #2a2a2e;
        z-index: 10;
        user-select: none;
      }
      #brand {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #brand span {
        opacity: 0.5;
        font-weight: 400;
        margin-left: 6px;
      }
      #cancel {
        appearance: none;
        border: 1px solid #2a2a2e;
        background: transparent;
        color: #f5f5f7;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      #cancel:hover {
        background: #22222a;
      }
      #frame {
        position: absolute;
        top: 36px;
        left: 0;
        width: 100vw;
        height: calc(100vh - 36px);
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <div id="brand">Depth<span>3D Mockups</span></div>
      <button id="cancel">Cancel</button>
    </div>
    <!--
      TODO: Swap this URL before publishing.
      Dev:  http://localhost:5173/app?embed=figma
      Prod: https://depth.app/app?embed=figma
    -->
    <iframe
      id="frame"
      src="http://localhost:5173/app?embed=figma"
      allow="clipboard-write; clipboard-read"
    ></iframe>

    <script>
      const cancelBtn = document.getElementById('cancel');
      cancelBtn.addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
      });

      // Listen for the export message from the Depth web app running in the iframe.
      window.addEventListener('message', async (event) => {
        const data = event.data;
        if (!data || typeof data !== 'object') return;

        // Depth posts { type: 'depth-export', png: ArrayBuffer, width, height }
        if (data.type === 'depth-export' && data.png) {
          try {
            const buffer =
              data.png instanceof ArrayBuffer
                ? data.png
                : data.png.buffer || null;
            if (!buffer) {
              console.error('[Depth UI] export payload missing ArrayBuffer');
              return;
            }
            const bytes = new Uint8Array(buffer);
            parent.postMessage(
              {
                pluginMessage: {
                  type: 'insert-image',
                  bytes,
                  width: data.width || 0,
                  height: data.height || 0,
                },
              },
              '*'
            );
          } catch (err) {
            console.error('[Depth UI] failed to relay export', err);
          }
        }
      });
    </script>
  </body>
</html>
